st:['先看:挑上面一個連結,看完不用做任何事','覺得有趣,再搜尋一個關鍵字(例如:音樂治療、舞蹈治療、復健機器人)','留意學會或學校的講座、工作坊公告;像藝術治療概論這類推廣課程,有興趣的人都能報名〔6〕','跟診所的治療師聊聊:他們有沒有用過復健科技或輔助設備','有興趣了,再回頭看需要的學歷與證照'],
